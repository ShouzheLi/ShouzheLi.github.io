<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Light studio viewport with a robot arm, a work table and a camera frustum">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <linearGradient id="arm2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <radialGradient id="soft" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <g stroke="#d8d8d8" stroke-width="1" opacity="0.55">
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900"/>
    <path d="M0 300H1200M0 600H1200"/>
  </g>
  <rect width="1200" height="900" fill="url(#soft)"/>

  <ellipse cx="760" cy="742" rx="330" ry="46" fill="#d2d2d2" opacity="0.55" filter="url(#blur)"/>
  <rect x="470" y="700" width="520" height="26" rx="4" fill="#e6e6e6"/>
  <rect x="500" y="726" width="460" height="10" fill="#dedede"/>

  <g transform="translate(640 690)">
    <rect x="-52" y="-34" width="104" height="34" rx="6" fill="#d9d9d9"/>
    <circle cx="0" cy="-34" r="30" fill="url(#arm)"/>
  </g>

  <g transform="translate(640 656) rotate(-24)">
    <rect x="-26" y="-190" width="52" height="190" rx="26" fill="url(#arm)"/>
    <circle cx="0" cy="-190" r="34" fill="url(#arm2)"/>
  </g>

  <g transform="translate(588 452) rotate(38)">
    <rect x="-22" y="-176" width="44" height="176" rx="22" fill="url(#arm)"/>
    <circle cx="0" cy="-176" r="30" fill="url(#arm2)"/>
  </g>

  <g transform="translate(742 330) rotate(78)">
    <rect x="-20" y="-138" width="40" height="138" rx="20" fill="url(#arm)"/>
    <circle cx="0" cy="-138" r="26" fill="#fafafa"/>
  </g>

  <g transform="translate(766 196) rotate(96)">
    <rect x="-18" y="-70" width="36" height="70" rx="12" fill="#ececec"/>
    <rect x="-30" y="-6" width="60" height="18" rx="3" fill="#d6d6d6"/>
    <rect x="-26" y="12" width="8" height="34" rx="3" fill="#cfcfcf"/>
    <rect x="18" y="12" width="8" height="34" rx="3" fill="#cfcfcf"/>
    <rect x="-26" y="46" width="52" height="8" rx="2" fill="#c4c4c4"/>
  </g>

  <g opacity="0.9">
    <path d="M880 250 L1010 200 L1060 320 L930 370 Z" fill="none" stroke="#c9c9c9" stroke-width="1.5"/>
    <path d="M880 250 L930 370 M1010 200 L1060 320" stroke="#d6d6d6" stroke-width="1"/>
    <circle cx="968" cy="286" r="4" fill="#1e3569"/>
  </g>

  <rect x="72" y="72" width="10" height="10" fill="#1e3569"/>
  <text x="96" y="82" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#8b8b8b">STUDIO VIEWPORT</text>
  <text x="72" y="838" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#a0a0a0">SIMULATION AS AN INSTRUMENT</text>
</svg>
