<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">SIM-EVAL evaluation platform thumbnail</title>
  <desc id="desc">Dark grid, a robot arm, a camera frustum, and four protocol cards labelled L0 to L3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1914"/><stop offset="1" stop-color="#0d0c0a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".2" r=".7">
      <stop offset="0" stop-color="#c2571f" stop-opacity=".24"/><stop offset="1" stop-color="#c2571f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e4cf"/><stop offset="1" stop-color="#bda98b"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#f3ede2" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg)"/>
  <rect width="800" height="500" rx="22" fill="url(#glow)"/>
  <rect width="800" height="500" rx="22" fill="url(#dots)"/>
  <g stroke="#f3ede2" stroke-opacity=".09">
    <path d="M0 420 L400 300 L800 420"/>
    <path d="M80 500 L400 300 L720 500"/>
    <path d="M200 500 L400 300 L600 500"/>
    <path d="M0 440 H800"/>
    <path d="M0 470 H800"/>
  </g>
  <path d="M150 400 L650 400 L700 430 L100 430 Z" fill="#241f19" stroke="#f3ede2" stroke-opacity=".14"/>
  <g>
    <rect x="230" y="400" width="62" height="22" rx="7" fill="#2b261f" stroke="#f3ede2" stroke-opacity=".2"/>
    <path d="M260 406 L290 330" stroke="url(#metal)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="290" cy="330" r="13" fill="#c2571f"/>
    <path d="M290 330 L380 300" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="380" cy="300" r="11" fill="#63b8a1"/>
    <path d="M380 300 L450 240" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
    <path d="M450 240 L488 224 M450 240 L480 252" stroke="#f1e4cf" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="520" y="360" width="62" height="38" rx="3" fill="#4a3c2c" stroke="#c2571f" stroke-opacity=".5"/>
    <rect x="510" y="348" width="82" height="60" fill="none" stroke="#63b8a1" stroke-dasharray="4 4" stroke-opacity=".6"/>
    <path d="M640 120 L520 250 L660 300 Z" fill="#63b8a1" fill-opacity=".05" stroke="#63b8a1" stroke-opacity=".3" stroke-dasharray="5 5"/>
    <rect x="630" y="108" width="24" height="18" rx="4" fill="#1c1813" stroke="#63b8a1" stroke-opacity=".6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="34" y="48" font-size="11" letter-spacing="3" fill="#c2571f">SIM-EVAL</text>
    <text x="34" y="70" font-size="9" letter-spacing="1.4" fill="#f3ede2" opacity=".5">REPRODUCIBLE VLA EVALUATION</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
    <rect x="34" y="438" width="74" height="30" rx="15" fill="#c2571f" fill-opacity=".16" stroke="#c2571f" stroke-opacity=".5"/>
    <text x="55" y="457" fill="#e9b49e">L0</text>
    <rect x="116" y="438" width="74" height="30" rx="15" fill="#63b8a1" fill-opacity=".1" stroke="#63b8a1" stroke-opacity=".4"/>
    <text x="137" y="457" fill="#9ed8c7">L1</text>
    <rect x="198" y="438" width="74" height="30" rx="15" fill="#63b8a1" fill-opacity=".1" stroke="#63b8a1" stroke-opacity=".4"/>
    <text x="219" y="457" fill="#9ed8c7">L2</text>
    <rect x="280" y="438" width="74" height="30" rx="15" fill="#63b8a1" fill-opacity=".1" stroke="#63b8a1" stroke-opacity=".4"/>
    <text x="301" y="457" fill="#9ed8c7">L3</text>
  </g>
  <text x="624" y="470" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5" fill="#f3ede2" opacity=".4">200 CONTRACT TESTS</text>
  <rect x="1" y="1" width="798" height="498" rx="21" fill="none" stroke="#f3ede2" stroke-opacity=".1"/>
</svg>
