<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Simulated scene</title>
  <desc id="desc">A cool wireframe simulation of the same tabletop scene with bounding boxes and a coordinate grid.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c20"/><stop offset="1" stop-color="#0b0f12"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a2e"/><stop offset="1" stop-color="#121a1d"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#63b8a1" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#63b8a1" opacity=".045"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#wall)"/>
  <rect width="900" height="470" fill="url(#grid)"/>
  <rect width="900" height="600" fill="url(#scan)"/>
  <path d="M0 470 H900 V600 H0 Z" fill="#0a0e11"/>
  <path d="M70 380 H830 L870 470 H30 Z" fill="url(#table)"/>
  <path d="M30 470 H870 V520 H30 Z" fill="#0f171a"/>
  <g stroke="#63b8a1" stroke-opacity=".16">
    <path d="M30 470 H870"/><path d="M70 380 H830"/><path d="M50 420 H850"/>
    <path d="M210 380 V470"/><path d="M470 380 V470"/><path d="M625 380 V470"/>
  </g>
  <!-- box wireframe -->
  <g fill="#223238" stroke="#63b8a1" stroke-opacity=".8" stroke-width="1.4">
    <path d="M210 300 L250 280 L370 280 L330 300 Z"/>
    <path d="M210 300 L330 300 L330 380 L210 380 Z"/>
    <path d="M330 300 L370 280 L370 360 L330 380 Z"/>
  </g>
  <g stroke="#63b8a1" stroke-opacity=".35">
    <path d="M210 300 L250 280 L250 360 L210 380"/>
    <path d="M250 360 L370 360"/>
  </g>
  <!-- cylinder wireframe -->
  <g fill="#1b2a2f" stroke="#63b8a1" stroke-opacity=".8" stroke-width="1.4">
    <path d="M430 300 H500 V390 H430 Z"/>
    <ellipse cx="465" cy="300" rx="35" ry="10"/>
    <ellipse cx="465" cy="390" rx="35" ry="10"/>
  </g>
  <!-- sphere wireframe -->
  <g fill="#2a2320" stroke="#c2571f" stroke-opacity=".85" stroke-width="1.4">
    <circle cx="625" cy="393" r="57"/>
    <ellipse cx="625" cy="393" rx="57" ry="18"/>
    <ellipse cx="625" cy="393" rx="18" ry="57"/>
  </g>
  <!-- cup wireframe -->
  <g fill="#17262a" stroke="#63b8a1" stroke-opacity=".75" stroke-width="1.3">
    <path d="M720 336 H764 V400 H720 Z"/>
    <ellipse cx="742" cy="336" rx="22" ry="7"/>
    <path d="M764 350 C788 350 788 384 764 384" fill="none"/>
  </g>
  <!-- bounding boxes -->
  <g fill="none" stroke="#c2571f" stroke-opacity=".7" stroke-dasharray="5 5">
    <rect x="198" y="268" width="186" height="124"/>
    <rect x="418" y="282" width="94" height="120"/>
    <rect x="556" y="324" width="138" height="138"/>
    <rect x="708" y="320" width="70" height="92"/>
  </g>
  <!-- axes -->
  <g stroke="#f3ede2" stroke-opacity=".55" stroke-width="1.5">
    <path d="M80 540 H180"/><path d="M80 540 V460"/>
    <path d="M80 540 L135 575"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#f3ede2" opacity=".55">
    <text x="186" y="544">x</text><text x="64" y="456">z</text><text x="140" y="586">y</text>
    <text x="34" y="566" letter-spacing="3" fill="#63b8a1" opacity=".8">SIM / USD</text>
  </g>
</svg>
