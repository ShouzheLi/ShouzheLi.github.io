<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background:
        radial-gradient(700px 420px at 86% -10%, rgba(194, 87, 31, .26), transparent 65%),
        #121110;
      color: #f3ede2;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    }
    .wrap { display: grid; grid-template-columns: 1.02fr .98fr; height: 100%; }
    .copy { padding: 76px 0 76px 72px; display: flex; flex-direction: column; justify-content: center; }
    .kicker { font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: .22em; color: #e06a55; }
    h1 { margin: 20px 0 18px; font-size: 58px; line-height: 1.06; font-weight: 500; letter-spacing: -.025em; max-width: 560px; }
    h1 em { color: #e06a55; font-style: italic; }
    p { margin: 0; max-width: 500px; color: #a99e8d; font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; line-height: 1.6; }
    .meta { margin-top: 26px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; color: #7e7465; }
    .visual { display: flex; align-items: center; justify-content: center; padding-right: 54px; }
    .visual img { width: 100%; border-radius: 22px; border: 1px solid #2d2923; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <div class="kicker">EMBODIED AI · FULL STACK · EVALUATION</div>
      <h1>From data to deployment, I build the <em>embodied AI loop.</em></h1>
      <p>My depth is simulation and evaluation. My range is the full stack — data, models, real2sim, deployment, and the economics.</p>
      <div class="meta">SHOUZHE LI · SHOUZHELI.GITHUB.IO</div>
    </div>
    <div class="visual">
      <img src="assets/img/hero-sim.svg" alt="">
    </div>
  </div>
</body>
</html>
